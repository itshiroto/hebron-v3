# One Caddy for the whole server: gets HTTPS certificates and routes each domain to its stack.
# Every stack joins the external "proxy" network (create it once: Networks → Add network → "proxy").
# Upstreams are container names (<stack>-<service>-1), which Docker resolves on the shared network.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - data:/data
      - config:/config
    networks:
      - proxy

configs:
  caddyfile:
    content: |
      # hebron-v3 (production): uncomment once the domain and the hebron-web stack exist
      # hebronfamilychurch.com {
      # 	reverse_proxy hebron-web-app-1:8080
      # }

      staging.gpdi-hebron.com {
      	reverse_proxy hebron-web-staging-app-1:8080
      }

      # hebron-event
      events.gpdi-hebron.com {
      	reverse_proxy hebron-event-nginx-1:80
      }

      events-test.hfc.my.id {
      	reverse_proxy hebron-event-staging-nginx-1:80
      }

volumes:
  data:
  config:

networks:
  proxy:
    external: true
