services:
  app:
    image: ghcr.io/itshiroto/hebron-v3:${IMAGE_TAG:-stable}
    restart: unless-stopped
    # No published ports: Caddy (docker-compose.proxy.yml) reaches the app over the shared proxy network
    networks:
      proxy:
        aliases:
          - hebron-${APP_ENV:-production}
    environment:
      APP_NAME: Hebron
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in the Portainer stack env}
      APP_URL: ${APP_URL:-https://hebronfamilychurch.com}
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/data/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      AUTORUN_ENABLED: "true"
      PHP_OPCACHE_ENABLE: "1"
    volumes:
      - database:/var/www/html/database/data
      - uploads:/var/www/html/storage/app

volumes:
  database:
  uploads:

networks:
  proxy:
    external: true
