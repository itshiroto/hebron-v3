name: Deploy to Production

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/itshiroto/hebron-v3:latest
            ghcr.io/itshiroto/hebron-v3:${{ github.sha }}

      - name: Redeploy Portainer stack
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
