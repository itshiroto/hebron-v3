name: Deploy

on:
  push:
    branches:
      - production
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main deploys staging. Each GitHub environment holds its own PORTAINER_WEBHOOK_URL secret
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/itshiroto/hebron-v3:${{ github.ref_name == 'production' && 'latest' || 'staging' }}
            ghcr.io/itshiroto/hebron-v3:${{ github.sha }}

      - name: Redeploy Portainer stack
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
